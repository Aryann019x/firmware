; Lite test build for ESP32-S3 modules with NO PSRAM (e.g. WROOM-1 N8)
; Display: ST7789 240x320 + XPT2046 touch CS=3. Same wiring as 8MB full.
; Uses env_light (LITE_VERSION=1, reduced IR/RF, no audio) + 4MB partitions.
; Full Bruce will NOT run without PSRAM — this is boot-test only.

[env:esp32s3-st7789-lite]
board = esp32s3-st7789
board_build.partitions = custom_4Mb.csv
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
build_src_filter =${env.build_src_filter} +<../boards/esp32s3-st7789>
extra_scripts =
	${env.extra_scripts}
	flto_prep.py
build_flags =
	${env.build_flags}
	-DLITE_VERSION=1
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true
	-Iboards/esp32s3-st7789
	-Os
	-DUSB_as_HID=1
	-DBAD_TX=GROVE_SDA
	-DBAD_RX=GROVE_SCL
	-DHAS_BTN=1
	-DBTN_ALIAS='"OK"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW
	-DIR_TX_PINS='{{"Grove Y", GROVE_SDA}, {"G1", 1}, {"G2", 2}}'
	-DIR_RX_PINS='{{"Grove W", GROVE_SCL}, {"G1", 1}, {"G2", 2}}'
	-DTXLED=2
	-DRXLED=1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DRF_TX_PINS='{{"Grove Y", GROVE_SDA}, {"G1", 1}, {"G2", 2}}'
	-DRF_RX_PINS='{{"Grove W", GROVE_SCL}, {"G1", 1}, {"G2", 2}}'
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=6
	-DCC1101_SS_PIN=15
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=16
	-DNRF24_SS_PIN=14
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=-1
	-DLORA_SCK=SPI_SCK_PIN
	-DLORA_MISO=SPI_MISO_PIN
	-DLORA_MOSI=SPI_MOSI_PIN
	-DLORA_CS=-1
	-DLORA_RST=-1
	-DLORA_DIO0=-1
	-DFM_RSTPIN=-1
	-DFP=1
	-DFM=2
	-DFG=3
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_INVERSION_ON
	-DTFT_CS=10
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_BL=38
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_MISO=13
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DHAS_TOUCH=1
	-DTOUCH_XPT2046_SPI=1
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=11
	-DXPT2046_SPI_BUS_MISO_IO_NUM=13
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=12
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=3
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192
	-DSDCARD_CS=4
	-DSDCARD_SCK=12
	-DSDCARD_MISO=13
	-DSDCARD_MOSI=11
	-DGROVE_SDA=8
	-DGROVE_SCL=9
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=17
	-DDEVICE_NAME='"ESP32-S3 ST7789 Lite"'

lib_deps =
	${env_light.lib_deps}
